<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="dangerBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12080a"/>
      <stop offset="100%" stop-color="#1f1014"/>
    </linearGradient>
    <linearGradient id="culvertDamaged" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2024"/>
      <stop offset="50%" stop-color="#3b2b30"/>
      <stop offset="100%" stop-color="#2a2024"/>
    </linearGradient>
    <linearGradient id="backwater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3d1e1e"/>
      <stop offset="100%" stop-color="#1f0f0f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#dangerBg)"/>

  <!-- Concrete Culvert Mouth with Storm Grate -->
  <rect x="60" y="80" width="680" height="500" rx="16" fill="url(#culvertDamaged)" stroke="#ff5c5c" stroke-width="4" stroke-opacity="0.4"/>
  <rect x="120" y="140" width="560" height="420" rx="8" fill="#0d080a"/>

  <!-- High Risk Backwater Layer -->
  <rect x="120" y="320" width="560" height="240" fill="url(#backwater)" opacity="0.95"/>

  <!-- Distorted/Bent Iron Grates behind jammed debris -->
  <g stroke="#6e3d45" stroke-width="8">
    <line x1="200" y1="140" x2="210" y2="440"/>
    <line x1="300" y1="140" x2="290" y2="430"/>
    <line x1="400" y1="140" x2="410" y2="420"/>
    <line x1="500" y1="140" x2="490" y2="430"/>
    <line x1="600" y1="140" x2="610" y2="440"/>
  </g>

  <!-- Heavy Debris Dam: Tree branch, Gunny bags, entangled plastic mats, garbage heaps -->
  <!-- Broken Fallen Tree Trunk -->
  <path d="M 130 420 Q 320 360 670 410 L 660 460 Q 330 400 130 470 Z" fill="#543825" stroke="#3d2719" stroke-width="4"/>
  
  <!-- Tangled Mass of Debris & Gunny Bags -->
  <path d="M 180 440 C 240 340, 380 350, 420 420 C 470 330, 620 340, 650 450 C 660 550, 160 560, 180 440 Z" fill="#2c201a" stroke="#4a362b" stroke-width="5"/>

  <!-- Industrial & Domestic Waste Objects -->
  <ellipse cx="280" cy="460" rx="55" ry="35" fill="#713f12" transform="rotate(-15 280 460)" opacity="0.9"/>
  <ellipse cx="490" cy="450" rx="65" ry="40" fill="#1e293b" transform="rotate(20 490 450)" opacity="0.9"/>
  <rect x="360" y="440" width="70" height="45" rx="5" fill="#991b1b" transform="rotate(10 360 440)" opacity="0.85"/>
  <circle cx="440" cy="490" r="30" fill="#0f766e" opacity="0.85"/>

  <!-- Warning Stripes & Hazard Overlay -->
  <g stroke="#ff5c5c" stroke-width="6" opacity="0.8">
    <line x1="140" y1="200" x2="220" y2="280"/>
    <line x1="220" y1="200" x2="300" y2="280"/>
    <line x1="500" y1="200" x2="580" y2="280"/>
    <line x1="580" y1="200" x2="660" y2="280"/>
  </g>

  <!-- Water pooling lines -->
  <path d="M 120 340 Q 400 360 680 340" stroke="#ff5c5c" stroke-width="3" stroke-dasharray="6,6" opacity="0.8"/>
  <text x="400" y="330" fill="#ff5c5c" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">CRITICAL BACKWATER HEAD: 1.4 METERS</text>

  <!-- HUD Telemetry -->
  <rect x="30" y="30" width="340" height="90" rx="8" fill="#07080a" fill-opacity="0.95" stroke="#ff5c5c" stroke-width="2"/>
  <circle cx="55" cy="60" r="10" fill="#ff5c5c" filter="url(#glow)"/>
  <text x="75" y="58" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">CLOG: 92% · COMPLETE BLOCK</text>
  <text x="75" y="80" fill="#ff5c5c" font-family="monospace" font-size="13">N-03 AMBERPET NALA OUTFALL</text>
  <text x="75" y="102" fill="#ff5c5c" font-family="monospace" font-size="12">PRIORITY: IMMEDIATE EXCAVATION</text>

  <!-- Stamp -->
  <rect x="570" y="30" width="200" height="40" rx="6" fill="#2d1217" stroke="#ff5c5c" stroke-width="2"/>
  <text x="670" y="55" fill="#ff5c5c" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">CRITICAL RED ALERT</text>
</svg>
