<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="clearSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#081418"/>
      <stop offset="100%" stop-color="#0d2127"/>
    </linearGradient>
    <linearGradient id="restoredWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f2c38"/>
      <stop offset="50%" stop-color="#324759"/>
      <stop offset="100%" stop-color="#1f2c38"/>
    </linearGradient>
    <linearGradient id="cleanStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <filter id="tealGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#clearSky)"/>

  <!-- Restored Culvert Concrete -->
  <path d="M 80 600 L 80 200 C 80 120, 220 70, 400 70 C 580 70, 720 120, 720 200 L 720 600 Z" fill="url(#restoredWall)" stroke="#2ee6c5" stroke-width="3" stroke-opacity="0.4"/>
  <path d="M 140 600 L 140 230 C 140 160, 260 120, 400 120 C 540 120, 660 160, 660 230 L 660 600 Z" fill="#081014"/>

  <!-- Deep Free-Flowing Desilted Stream -->
  <path d="M 140 450 Q 400 460 660 450 L 660 600 L 140 600 Z" fill="url(#cleanStream)"/>

  <!-- Rapid Water Flow Lines (High Capacity Free Drain) -->
  <g stroke="#2ee6c5" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <path d="M 220 480 Q 300 470 420 490 Q 520 510 600 480"/>
    <path d="M 180 520 Q 320 500 450 530 Q 550 540 640 510"/>
    <path d="M 260 550 Q 380 540 480 560 Q 560 570 610 540"/>
  </g>

  <!-- Gleaming Polished Steel Grates (Zero Debris) -->
  <g stroke="#6ee7b7" stroke-width="5" opacity="0.9">
    <line x1="200" y1="220" x2="200" y2="460"/>
    <line x1="280" y1="180" x2="280" y2="460"/>
    <line x1="360" y1="160" x2="360" y2="460"/>
    <line x1="440" y1="160" x2="440" y2="460"/>
    <line x1="520" y1="180" x2="520" y2="460"/>
    <line x1="600" y1="220" x2="600" y2="460"/>
    <line x1="160" y1="260" x2="640" y2="260" stroke-width="6"/>
    <line x1="150" y1="360" x2="650" y2="360" stroke-width="6"/>
  </g>

  <!-- Water Surface Reflections -->
  <ellipse cx="400" cy="460" rx="160" ry="15" fill="#5eead4" opacity="0.4"/>

  <!-- SEAL Certified Watermark & Verification Badge -->
  <g filter="url(#tealGlow)">
    <rect x="520" y="30" width="250" height="90" rx="10" fill="#042f2e" fill-opacity="0.95" stroke="#2ee6c5" stroke-width="2"/>
    <circle cx="550" cy="75" r="16" fill="#2ee6c5"/>
    <path d="M 543 75 L 548 80 L 558 70" stroke="#07080a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="575" y="68" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">PROOF VERIFIED</text>
    <text x="575" y="88" fill="#2ee6c5" font-family="monospace" font-size="12">ESCROW ₹180 RELEASED</text>
  </g>

  <!-- HUD Telemetry -->
  <rect x="30" y="30" width="310" height="90" rx="8" fill="#07080a" fill-opacity="0.95" stroke="#2ee6c5" stroke-width="2"/>
  <circle cx="55" cy="60" r="10" fill="#2ee6c5" filter="url(#tealGlow)"/>
  <text x="75" y="58" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">CLOG: 12% · SEALED</text>
  <text x="75" y="80" fill="#8b97a8" font-family="monospace" font-size="13">CAPACITY: 100% DISCHARGED</text>
  <text x="75" y="102" fill="#2ee6c5" font-family="monospace" font-size="12">READY FOR FIRST RAIN</text>
</svg>
